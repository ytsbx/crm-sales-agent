name: Release smoke

# 发布分支专用检查（2026-11-28）
#
# release/** 是从生产快照长出来的发布副本，只包含本次要发的少量改动。
# 拿开发分支的全量回归去跑它，会把“没有新功能”当成失败，永远红。
# 这里只守发布必须成立的三件事：空库迁移 + 种子、后端启动和核心接口、
# 前端构建和核心页面能打开。全量回归仍由 ci.yml 在功能分支执行。

on:
  push:
    branches: ['release/**']
  workflow_dispatch:

jobs:
  release-smoke:
    name: 发布冒烟（迁移 / 启动 / 核心页面）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm123456
          POSTGRES_DB: crm_iso_release
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm_iso_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://crm:crm123456@127.0.0.1:5432/crm_iso_release
      API_BASE: http://127.0.0.1:8000
      APP_BASE: http://127.0.0.1:5173
      VITE_API_PROXY_TARGET: http://127.0.0.1:8000
      JWT_SECRET: ci-only-secret-key-at-least-32-bytes!
      DEEPSEEK_API_KEY: ""
      DINGTALK_PUSH_OFF: "1"
      WECOM_PUSH_OFF: "1"
      SCHEDULER_ENABLED: "false"
      EDGE_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 确认浏览器
        run: |
          which google-chrome || which chromium || { echo "runner 上没有 Chrome"; exit 1; }
          google-chrome --version || chromium --version

      - name: 后端：装依赖 → 语法检查 → 迁移 → 种子 → 启动
        working-directory: backend
        run: |
          pip install -r requirements.lock.txt
          python -m compileall -q app
          PYTHONPATH=. python -m alembic upgrade head
          PYTHONPATH=. python -m alembic current
          PYTHONPATH=. python scripts/seed.py
          PYTHONPATH=. nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/release-backend.log 2>&1 &
          python scripts/wait_backend.py http://127.0.0.1:8000 || { tail -n 40 /tmp/release-backend.log; exit 1; }
          echo "backend ready"

      - name: 前端：装依赖 → 构建
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: 前端：启动 dev server
        working-directory: frontend
        run: |
          nohup pnpm exec vite --host 127.0.0.1 --port 5173 > /tmp/release-frontend.log 2>&1 &
          for i in $(seq 1 40); do
            curl -s -o /dev/null http://localhost:5173/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:5173/ || { tail -n 40 /tmp/release-frontend.log; exit 1; }
          echo "frontend ready"

      - name: 发布冒烟（核心页面）
        run: node ops/release_smoke.mjs

      - name: 失败时输出两侧日志
        if: failure()
        run: |
          echo "=== 后端日志 ==="
          tail -n 80 /tmp/release-backend.log || true
          echo "=== 前端日志 ==="
          tail -n 80 /tmp/release-frontend.log || true
