# CI：push 时自动跑全量回归（接口套件按 ops/check_suites.txt + 静态检查 + UI 冒烟）。
#
# 设计说明：
# - 数据库用 services 起一个全新 PostgreSQL，走 alembic 建表 + seed.py 种子——
#   和"新人第一次把项目跑起来"是同一条链路，链路断了 CI 先红；
# - 刻意不配 DEEPSEEK_API_KEY：Agent 套件按"未配模型"口径断言
#   （未配置时明确报说明而不是静默失败，这正是要验证的行为）；
# - UI 冒烟单独一个 job：需要前端 dev server + Chrome（runner 自带），
#   与后端 job 并行跑，互不拖累。
# - 接口套件清单**不在本文件里硬编码**，读的是 ops/check_suites.txt——
#   本地 ops/run_checks.sh 读同一个文件，避免"本地全绿但 CI 漏跑"（09-28 踩过）。
#
# 本地想跑同样的东西：ops/run_checks.sh（需要本机后端已在 8000 运行）。

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端回归（套件清单见 ops/check_suites.txt + 静态检查）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm123456
          POSTGRES_DB: crm_sales_agent
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm_sales_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://crm:crm123456@127.0.0.1:5432/crm_sales_agent
      JWT_SECRET: ci-only-secret-key-at-least-32-bytes!
      DEEPSEEK_API_KEY: ""
      DINGTALK_PUSH_OFF: "1"
      WECOM_PUSH_OFF: "1"
      SCHEDULER_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pyflakes

      - name: 迁移到最新表结构（空库 → head）
        run: |
          PYTHONPATH=. python -m alembic upgrade head
          PYTHONPATH=. python -m alembic current

      - name: 种子数据
        run: PYTHONPATH=. python scripts/seed.py

      - name: 启动后端（8000）
        run: |
          PYTHONPATH=. nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:8000/docs && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:8000/docs || { tail -n 40 /tmp/backend.log; exit 1; }
          echo "backend ready"

      - name: 静态检查（pyflakes / 模型列 / 权限码）
        run: |
          python -m pyflakes app
          PYTHONPATH=. python scripts/check_model_attrs.py
          PYTHONPATH=. python scripts/check_permissions.py

      - name: 单元测试（pytest，纯函数，不依赖数据库）
        run: PYTHONPATH=. python -m pytest

      - name: 接口回归（顺序跑，套件间互不冲突；清单见 ops/check_suites.txt）
        # 两处刻意的写法（2026-10-07 排查 CI 长期失败的产物）：
        # 1) `PYTHONUNBUFFERED` + `python -u`：CI 不是终端，不关缓冲的话 stdout 会走
        #    块缓冲 —— 套件崩溃时**缓冲区里还没来得及刷出的日志全部丢失**，
        #    "失败在哪、为什么失败"就永远看不见（实测：日志里几十行 OK 的时间戳
        #    全在同一毫秒，说明是一次性 flush 的，真实执行其实分散在几百毫秒里）。
        # 2) 不再用 `set -e` 一个失败就中断：**跑完所有套件再汇总失败清单**，
        #    并在注解里点名是哪些套件红的。原来静默中断只会告诉你"失败了"，
        #    红了两天都没人知道为什么红 —— 信号价值等于零。
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -u
          failed=""
          while read -r suite; do
            case "$suite" in '' | '#'*) continue ;; esac
            if [ ! -f "scripts/$suite.py" ]; then
              echo "::error::清单里的套件找不到脚本：scripts/$suite.py"
              failed="$failed $suite"
              continue
            fi
            echo "::group::=== $suite ==="
            if PYTHONPATH=. python -u "scripts/$suite.py"; then
              echo "OK  $suite"
            else
              echo "::error::套件失败：$suite"
              failed="$failed $suite"
            fi
            echo "::endgroup::"
          done < ../ops/check_suites.txt
          if [ -n "$failed" ]; then
            echo "::error::接口回归有套件未通过：$failed"
            exit 1
          fi
          echo "接口回归：清单里的套件全部通过"

      - name: 失败时输出后端日志
        if: failure()
        run: tail -n 80 /tmp/backend.log

  ui-smoke:
    name: UI 冒烟（页面内容 + 交互断言）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm123456
          POSTGRES_DB: crm_sales_agent_smoke
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm_sales_agent_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://crm:crm123456@127.0.0.1:5432/crm_sales_agent_smoke
      JWT_SECRET: ci-only-secret-key-at-least-32-bytes!
      DEEPSEEK_API_KEY: ""
      DINGTALK_PUSH_OFF: "1"
      WECOM_PUSH_OFF: "1"
      SCHEDULER_ENABLED: "false"
      SMOKE_ENABLE_FIXTURES: "1"
      EDGE_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 确认浏览器（runner 自带 Chrome）
        run: |
          which google-chrome || which chromium || { echo "runner 上没有 Chrome"; exit 1; }
          google-chrome --version || chromium --version

      - name: 后端：装依赖 → 迁移 → 种子 → 启动
        working-directory: backend
        run: |
          pip install -r requirements.txt
          PYTHONPATH=. python -m alembic upgrade head
          PYTHONPATH=. python scripts/seed.py
          PYTHONPATH=. nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:8000/docs && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:8000/docs || { tail -n 40 /tmp/backend.log; exit 1; }
          echo "backend ready"

      - name: 前端：类型检查 + 构建（白屏根因防线，解析错误在这里先红）
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: 前端：启动 dev server
        working-directory: frontend
        run: |
          nohup pnpm exec vite --host 127.0.0.1 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 40); do
            curl -s -o /dev/null http://localhost:5173/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:5173/ || { tail -n 40 /tmp/frontend.log; exit 1; }
          echo "frontend ready"

      - name: UI 冒烟
        run: node ops/smoke_ui.mjs

      # 与后端回归同一个道理：失败时要把"现场"打出来。
      # 否则注解里只有一句 exit code 1，没人知道是前端还是后端的问题。
      - name: UI 冒烟失败时输出两侧日志
        if: failure()
        run: |
          echo "=== 前端 dev server 日志 ==="
          tail -n 60 /tmp/frontend.log || true
          echo "=== 后端日志 ==="
          tail -n 60 /tmp/backend.log || true

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: /tmp/crm-smoke/
          retention-days: 7
          if-no-files-found: ignore
