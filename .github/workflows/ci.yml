# CI：push 时自动跑全量回归（接口套件按 ops/check_suites.txt + 静态检查 + UI 冒烟）。
#
# 设计说明：
# - 数据库用 services 起一个全新 PostgreSQL，走 alembic 建表 + seed.py 种子——
#   和"新人第一次把项目跑起来"是同一条链路，链路断了 CI 先红；
# - 刻意不配 DEEPSEEK_API_KEY：Agent 套件按"未配模型"口径断言
#   （未配置时明确报说明而不是静默失败，这正是要验证的行为）；
# - UI 冒烟单独一个 job：需要前端 dev server + Chrome（runner 自带），
#   与后端 job 并行跑，互不拖累。
# - 接口套件清单**不在本文件里硬编码**，读的是 ops/check_suites.txt——
#   本地 ops/run_checks.sh 读同一个文件，避免"本地全绿但 CI 漏跑"（09-28 踩过）。
#
# 本地想跑同样的东西：ops/run_checks.sh —— 也要像这里一样显式给 API_BASE 与
# DATABASE_URL（指向一次性隔离库的后端，例如 8001 + crm_iso_test）。
# 2026-10-08 起套件与 run_checks.sh 都有防呆：API_BASE 不许指 8000（开发后端）、
# 库名必须是一次性库，否则直接退出（判据见 backend/scripts/_test_support.py）。

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端回归（套件清单见 ops/check_suites.txt + 静态检查）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm123456
          # 库名必须"看起来就是一次性的"：多个套件有护栏，看到库名疑似开发库
          # （crm_sales_agent）会直接拒跑，理由是会写库、怕污染真数据。
          # 原来这里就叫 crm_sales_agent —— 与开发库同名，于是两个套件一直拒跑，
          # 只是以前 CI 在前面的套件就卡死了，从没跑到它们（2026-10-07 暴露）。
          # 取名 crm_iso_test 是三种判据的交集：多数套件要 "test" in 库名、
          # check_biz_doc_freeze 要 "iso"/"check"（它**不看** CI 变量）、
          # check_attachment_business_auth 要 crm_iso/crm_check 前缀。
          POSTGRES_DB: crm_iso_test
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm_iso_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://crm:crm123456@127.0.0.1:5432/crm_iso_test
      # 与本地 ops/run_checks.sh 对齐：那边 export API_BASE，这里原来没给。
      # 十个套件"必须显式给 API_BASE"（不给就拒跑，怕默认打到开发后端），
      # 另有 `check_delivery_planning` 硬取这个变量会 KeyError。
      # 端口用 8001 而不是 8000：三个套件的护栏是 `if "8000" in API_BASE: 拒跑`
      # （8000 被定义为"开发后端"），CI 里后端也跟着挪到 8001，
      # 这样护栏语义在 CI 里依然成立，不用去改套件判断。
      API_BASE: http://127.0.0.1:8001/api/v1
      JWT_SECRET: ci-only-secret-key-at-least-32-bytes!
      DEEPSEEK_API_KEY: ""
      DINGTALK_PUSH_OFF: "1"
      WECOM_PUSH_OFF: "1"
      SCHEDULER_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt pyflakes

      - name: 迁移到最新表结构（空库 → head）
        run: |
          PYTHONPATH=. python -m alembic upgrade head
          PYTHONPATH=. python -m alembic current

      - name: 种子数据
        run: PYTHONPATH=. python scripts/seed.py

      - name: 启动后端（8001）
        run: |
          PYTHONPATH=. nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8001 > /tmp/backend.log 2>&1 &
          python scripts/wait_backend.py http://127.0.0.1:8001 || { tail -n 40 /tmp/backend.log; exit 1; }
          echo "backend ready"

      - name: 静态检查（pyflakes / 模型列 / 权限码）
        run: |
          python -m pyflakes app
          PYTHONPATH=. python scripts/check_model_attrs.py
          PYTHONPATH=. python scripts/check_permissions.py

      - name: 单元测试（pytest，纯函数，不依赖数据库）
        run: PYTHONPATH=. python -m pytest

      - name: 登记项自检（清单里的套件脚本、前端单测文件是否都在仓库里）
        # ⚠️ 为什么要这一步（2026-10-14 复盘：CI 连红十几次，全是同一类）
        #
        # 这个仓库经常有**多个会话同时改**。反复出现的病程是：
        # **登记项与其对应物被拆到不同的提交里** ——
        # 有人往 ops/check_suites.txt 或本文件加了一行、或先写了断言，
        # 而脚本/测试文件/实现还在他工作区；另一个人提交时把登记项一起带上主干
        # → CI 跑分支上的一切 → **所有人的 CI 红**，且红在下游
        # （"找不到脚本/文件"、"旧负责人仍能删除客户"），指向受害者而不是漏提交的人。
        #
        # ⚠️ 判定写在 `backend/scripts/check_registered_files.py` 里，**不要塞回 bash**：
        # 我第一版就是写成这里的一段 bash（`while read` + 嵌套 `$(grep … | sed …)`），
        # 本地与干净检出都过、**CI 上却红且不打印缺哪个文件** —— 嵌套命令替换 +
        # sed 转义在不同 shell 下行为不同，是最难查的一类红。
        # 现在它是个能离线跑、能自己测的脚本（`--list` 只列不判失败）。
        working-directory: backend
        run: |
          PYTHONPATH=. python scripts/check_registered_files.py
          # 「同一判据有没有在所有出口铺开」—— 2026-10-14 加。这一轮审查报的 20 条里
          # **至少 8 条**是这个病程（脱敏/范围/软删/日期 在 N 个出口只铺了 M 个），
          # 而且正确写法常在同一个文件甚至相邻一行。判据成文后就该由 CI 守，不靠人工审。
          PYTHONPATH=. python scripts/check_output_criteria.py
          # 软删模型的统计有没有排 `deleted_at`（13 个模型是软删的；漏一处，删掉的数据继续出现在数字里）。
          PYTHONPATH=. python scripts/check_soft_delete_filters.py
          # 统计/仪表盘有没有套数据范围（详情有范围、统计漏了 —— 数字对不上没人查代码）。
          PYTHONPATH=. python scripts/check_stats_data_scope.py
          # 查询里引用的模型有没有对应的 JOIN（没 join 会变成**笛卡尔积**：行数放大、
          # 分页与 total 全错，而且不报错 —— 2026-10-14 我就是在 contract 台账上踩的）。
          PYTHONPATH=. python scripts/check_query_joins.py

      - name: 接口回归（顺序跑，套件间互不冲突；清单见 ops/check_suites.txt）
        # 三处刻意的写法（2026-10-07 排查 CI 长期失败的产物）：
        # 1) `PYTHONUNBUFFERED` + `python -u`：CI 不是终端，不关缓冲的话 stdout 会走
        #    块缓冲 —— 套件崩溃时**缓冲区里还没来得及刷出的日志全部丢失**，
        #    "失败在哪、为什么失败"就永远看不见（实测：日志里几十行 OK 的时间戳
        #    全在同一毫秒，说明是一次性 flush 的，真实执行其实分散在几百毫秒里）。
        # 2) 不再用 `set -e` 一个失败就中断：**跑完所有套件再汇总失败清单**，
        #    并在注解里点名是哪些套件红的。原来静默中断只会告诉你"失败了"，
        #    红了两天都没人知道为什么红 —— 信号价值等于零。
        # 3) 输出 `tee` 落盘 + 量最长行：**超长单行会把日志上传卡死**。
        #    实测（check_dingtalk_contract 把整张 audit_logs 表交给 check() 打印）
        #    输出了一行 224,732 字符 —— job 静默卡 136 秒后被判失败，日志停在
        #    那一行之前，连报错都没有，靠翻日志永远查不出来。
        #    现在超过 10000 字符就 `::warning::` 点名（正常套件最长行 ≤ 3200）。
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -u
          set -o pipefail
          failed=""
          while read -r suite; do
            case "$suite" in '' | '#'*) continue ;; esac
            if [ ! -f "scripts/${suite}.py" ]; then
              # ⚠️ 这条最容易出现在**多人同时改仓库**的时候（2026-10-14 实测踩到）：
              # 有人往 `ops/check_suites.txt` 加了一行、脚本却还没提交；而另一个人
              # 提交时整文件 `git add ops/check_suites.txt`，把那一行一起带上了主干
              # → CI 找不到脚本、红。
              #
              # ⚠️⚠️ 文案里的变量**必须用 `${}` 定界**：我第一版写的是
              # `"scripts/$suite.py"` —— bash 会把它当成变量名 `suite.py` 展开，
              # 在 `set -u` 下直接报 unbound variable，**整个跑套件的循环当场崩掉**
              # （于是 CI 红的表象是"清单里的套件找不到脚本"，而其实一条套件都没跑）。
              # 我为了这条 CI 提示反而让 CI 更坏了 —— 记在这里别再犯。
              echo "::error::清单里的套件找不到脚本：scripts/${suite}.py —— 多半是有人加了清单行但脚本还没提交（共享文件整文件 add 时被带进来）。请确认脚本是否在别人工作区，跑通后补交。"
              failed="$failed ${suite}"
              continue
            fi
            echo "::group::=== $suite ==="
            out="$(mktemp)"
            if PYTHONPATH=. python -u "scripts/${suite}.py" 2>&1 | tee "$out"; then
              echo "OK  $suite"
            else
              echo "::error::套件失败：$suite"
              failed="$failed $suite"
            fi
            maxlen=$(wc -L < "$out" 2>/dev/null || echo 0)
            rm -f "$out"
            if [ "${maxlen:-0}" -gt 10000 ]; then
              echo "::warning::$suite 有超长单行（最长 $maxlen 字符），日志上传可能卡住：多半是某处把大对象直接 print 出来、或传给了 check() 去打印"
            fi
            echo "::endgroup::"
          done < ../ops/check_suites.txt
          if [ -n "$failed" ]; then
            echo "::error::接口回归有套件未通过：$failed"
            exit 1
          fi
          echo "接口回归：清单里的套件全部通过"

      - name: 失败时输出后端日志
        if: failure()
        run: tail -n 80 /tmp/backend.log

  ui-smoke:
    name: UI 冒烟（页面内容 + 交互断言）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm123456
          POSTGRES_DB: crm_iso_smoke
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm_iso_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # ⚠️ 库名必须能过 `backend/scripts/_test_support.py` 的防呆：以 crm_iso /
      # crm_check / crm_test 开头，或以 _test 结尾。**原来这里叫
      # `crm_sales_agent_smoke`** —— 它既不以那三个前缀开头、也不以 _test 结尾，
      # 所以冒烟末尾的收尾清扫（`clean_test_run_leftovers.py`，它也调 require_isolated_db）
      # 一直被拒跑 → 「✗ 收尾清扫失败」→ UI 冒烟 job 恒红（2026-10-10 修）。
      # 光把 crm_sales_agent 加进 DEV_DATABASES 也救不了它：卡住它的是**前缀规则**。
      DATABASE_URL: postgresql+asyncpg://crm:crm123456@127.0.0.1:5432/crm_iso_smoke
      # smoke_ui.mjs 会把 API_BASE 作为后端根地址；本 job 的后端监听 8000。
      API_BASE: http://127.0.0.1:8000
      # Vite dev server 在本 job 监听 5173；冒烟脚本的默认开发端口是 5274。
      APP_BASE: http://127.0.0.1:5173
      VITE_API_PROXY_TARGET: http://127.0.0.1:8000
      JWT_SECRET: ci-only-secret-key-at-least-32-bytes!
      DEEPSEEK_API_KEY: ""
      DINGTALK_PUSH_OFF: "1"
      WECOM_PUSH_OFF: "1"
      SCHEDULER_ENABLED: "false"
      SMOKE_ENABLE_FIXTURES: "1"
      EDGE_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 确认浏览器（runner 自带 Chrome）
        run: |
          which google-chrome || which chromium || { echo "runner 上没有 Chrome"; exit 1; }
          google-chrome --version || chromium --version

      - name: 后端：装依赖 → 迁移 → 种子 → 启动
        working-directory: backend
        run: |
          pip install -r requirements.txt
          PYTHONPATH=. python -m alembic upgrade head
          PYTHONPATH=. python scripts/seed.py
          PYTHONPATH=. nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          python scripts/wait_backend.py http://127.0.0.1:8000 || { tail -n 40 /tmp/backend.log; exit 1; }
          echo "backend ready"

      - name: 前端：类型检查 + 构建（白屏根因防线，解析错误在这里先红）
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          # 两个纯逻辑单测：不需要浏览器，也不引测试框架（Node 自带 node:test）。
          # blocked_hint 那条守的是「灰按钮必须说得出为什么」（主人 2026-10-12）。
          node --test ../ops/request_key.test.mjs
          node --test ../ops/blocked_hint.test.mjs
          node --test ../ops/guarded_button.test.mjs
          node --test ../ops/payment_allocation.test.mjs
          # 静态检查：含禁用控件的页面必须接了共用件，或在例外清单里写明理由。
          # 单测只测共享件算得对不对，**测不到"页面忘了接"**（这一轮的毛病正是忘了接）。
          python3 ../ops/check_disabled_hint.py
          # 静态检查：核价历史里会出现的每个审计动作，界面上必须有中文名。
          # 后端加了动作而前端没跟 → 屏幕上会印出 skipped/[object Object] 这类机器话，
          # 而且**不报错、不失败**，只能靠人去看那一页（主人 2026-10-12 就是这么发现的）。
          # 静态检查：**"必填"这件事有没有标清楚**。
          # 缘起：主人 2026-10-13 截图案例弹窗——「关键动作/可复用做法」是二选一
          # （提交审核时才要求），当初故意不打星（打了是撒谎），但只留一行灰字
          # 不显眼，主人的结论是"必填的怎么没标 * 号"。
          # 现在分三档（实心红=现在必填 / 空心灰=条件必填 / 无=选填），这条守：
          # 标了条件必填必须说明条件、hint 里写着"至少填一项"的必须标、两者不许并存。
          python3 ../ops/check_form_required_marks.py
          python3 ../ops/check_action_labels.py
          # 静态检查：审计页三层中文名（对象/动作/字段）+ 生成物是否最新。
          # 这些漏法**不报错、不失败**，只在那一页上难看（主人 2026-10-12 亲自发现）。
          python3 ../ops/check_audit_labels.py
          # 系统配置不能把后端内部 key 直接当成用户可见名称。
          python3 ../ops/check_setting_labels.py
          # 静态检查：**不许靠切 ISO 串显示时间**。
          # 后端下发的是带 UTC 偏移的瞬时，`.slice(0,10)` 等于按 UTC 显示：
          # 差 8 小时，跨零点**整个日期差一天**，而"约定下次跟进/签署时间/
          # 发送时间"正是用户据以行动的字段（2026-10-14 审查一次抓到 13 处，
          # 且同一页里常常两种口径并存）。
          python3 ../ops/check_frontend_utc_dates.py
          # AI 分析的信封字段必须有中文名。兜底是「没映射就印英文原词」，
          # 后端加字段就必然漏一次给用户看（主人 2026-10-13 看到
          # `overdue_count 0`/`open_amount ¥501` 才发现的）。
          python3 ../ops/check_agent_analysis_labels.py
          # 「英文枚举值 → 中文」这几张前端映射表必须覆盖后端会产出的值：
          # 交期节点、审批状态、价格历史字段与报价状态。写法都是 `MAP[v] ?? v`，
          # 后端加一个枚举值界面就悄悄多一句英文。
          python3 ../ops/check_enum_labels.py
          # 登录态是 localStorage 持久化的，旧版本的旧数据会被新版直接读出来用：
          # 把 user 的字段当成"一定存在"会让**每一页**崩成 React 的英文报错
          # （实测：`user.roles.includes` + 登录接口只返回 {id,name,username}）。
          python3 ../ops/check_persisted_user_shape.py
          # 静态检查：角色弹窗的权限分组是否覆盖后端所有权限模块。
          # 漏了会让某个模块的新权限掉进「其他权限」（主人 2026-10-12：
          # 「要找具体的权限要翻半天」——分组的意义就是不用翻）。
          python3 ../ops/check_permission_groups.py
          # 静态检查：用户可见文案里不许再用 `#` 拼编号（主人 2026-10-12：
          # 「报价单 #8。这个 # 啥意思」——统一成「报价单编号 8」）。
          python3 ../ops/check_hash_ids.py
          # 静态检查：会写跟单节点的写接口必须持有订单锁。
          # 漏了会把"未收齐"写成"收款完成"（第三批复审遗留 P1，真库已复现）；
          # 真库版脚本是 scripts/check_milestone_lock_race.py（CI 上跑这条离线的）。
          python3 ../ops/check_milestone_lock.py
          # 静态检查：用户可见文案里不许出现 Markdown 的 `**`。
          # 缘起：主人 2026-10-12 看到弹窗里印着「这是**发给客户**的记录」——
          # React 不认 Markdown，`**` 会原样显示。这种错 tsc 全绿、只有人眼看得到，
          # 而我自己在同一个弹窗里就犯了两次。
          python3 ../ops/check_ui_text_no_markdown.py
          # 静态检查：测试脚本"抠产品文案"的正则不许和文案脱钩。
          # 缘起：全站把 `打样单 #N` 改成「打样单编号 N」之后，
          # check_sixth_round_p2 的正则永远匹配空集合 —— 两条断言必红、
          # 一条假绿，而表象是"实现坏了"（我查了半天，还建了 git 基线对比）。
          python3 ../ops/check_copy_coupled_assertions.py
          # 静态检查：算金额的上下文必须拒外币（主人 2026-10-12 口径：
          # 「没有外币这个东西…有人用外币就给他报错」）。
          # 单测只能证明闸函数本身好使，证明不了"它被接在这条计算上"——
          # 反向验证时撤掉调用，单测照样全绿（实测踩过）。
          python3 ../ops/check_foreign_currency_rejected.py

      - name: 前端：启动 dev server
        working-directory: frontend
        run: |
          nohup pnpm exec vite --host 127.0.0.1 --port 5173 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 40); do
            curl -s -o /dev/null http://localhost:5173/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:5173/ || { tail -n 40 /tmp/frontend.log; exit 1; }
          echo "frontend ready"

      - name: UI 冒烟
        run: node ops/smoke_ui.mjs

      # 与后端回归同一个道理：失败时要把"现场"打出来。
      # 否则注解里只有一句 exit code 1，没人知道是前端还是后端的问题。
      - name: UI 冒烟失败时输出两侧日志
        if: failure()
        run: |
          echo "=== 前端 dev server 日志 ==="
          tail -n 60 /tmp/frontend.log || true
          echo "=== 后端日志 ==="
          tail -n 60 /tmp/backend.log || true

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: /tmp/crm-smoke/
          retention-days: 7
          if-no-files-found: ignore
