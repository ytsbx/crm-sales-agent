# CI：push 时自动跑全量回归（接口 8 套件 + 静态检查 + UI 冒烟）。
#
# 设计说明：
# - 数据库用 services 起一个全新 PostgreSQL，走 alembic 建表 + seed.py 种子——
#   和"新人第一次把项目跑起来"是同一条链路，链路断了 CI 先红；
# - 刻意不配 DEEPSEEK_API_KEY：Agent 套件按"未配模型"口径断言
#   （未配置时明确报说明而不是静默失败，这正是要验证的行为）；
# - UI 冒烟单独一个 job：需要前端 dev server + Chrome（runner 自带），
#   与后端 job 并行跑，互不拖累。
#
# 本地想跑同样的东西：ops/run_checks.sh（需要本机后端已在 8000 运行）。

name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: 后端回归（8 套件 + 静态检查）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm123456
          POSTGRES_DB: crm_sales_agent
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm_sales_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://crm:crm123456@127.0.0.1:5432/crm_sales_agent
      JWT_SECRET: ci-only-secret-key-at-least-32-bytes!
      DEEPSEEK_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyflakes

      - name: 迁移到最新表结构（空库 → head）
        run: |
          PYTHONPATH=. python -m alembic upgrade head
          PYTHONPATH=. python -m alembic current

      - name: 种子数据
        run: PYTHONPATH=. python scripts/seed.py

      - name: 启动后端（8000）
        run: |
          PYTHONPATH=. nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:8000/docs && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:8000/docs || { tail -n 40 /tmp/backend.log; exit 1; }
          echo "backend ready"

      - name: 静态检查（pyflakes / 模型列 / 权限码）
        run: |
          python -m pyflakes app
          PYTHONPATH=. python scripts/check_model_attrs.py
          PYTHONPATH=. python scripts/check_permissions.py

      - name: 接口回归（顺序跑，套件间互不冲突）
        run: |
          set -e
          for suite in check_quote_api check_reference_integrity check_order_payment_api \
                       check_customer_contact_api check_lead_auth_role_api \
                       check_product_pricing_api check_agent_api \
                       check_approval_rules check_agent_stream check_scheduler; do
            echo "::group::=== $suite ==="
            PYTHONPATH=. python scripts/$suite.py
            echo "::endgroup::"
          done

      - name: 失败时输出后端日志
        if: failure()
        run: tail -n 80 /tmp/backend.log

  ui-smoke:
    name: UI 冒烟（28 页截图 + 控制台报错）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm123456
          POSTGRES_DB: crm_sales_agent
          POSTGRES_INITDB_ARGS: "--encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm_sales_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://crm:crm123456@127.0.0.1:5432/crm_sales_agent
      JWT_SECRET: ci-only-secret-key-at-least-32-bytes!
      DEEPSEEK_API_KEY: ""
      EDGE_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 确认浏览器（runner 自带 Chrome）
        run: |
          which google-chrome || which chromium || { echo "runner 上没有 Chrome"; exit 1; }
          google-chrome --version || chromium --version

      - name: 后端：装依赖 → 迁移 → 种子 → 启动
        working-directory: backend
        run: |
          pip install -r requirements.txt
          PYTHONPATH=. python -m alembic upgrade head
          PYTHONPATH=. python scripts/seed.py
          PYTHONPATH=. nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:8000/docs && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:8000/docs || { tail -n 40 /tmp/backend.log; exit 1; }
          echo "backend ready"

      - name: 前端：安装依赖并启动 dev server
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          nohup pnpm dev > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 40); do
            curl -s -o /dev/null http://localhost:5173/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:5173/ || { tail -n 40 /tmp/frontend.log; exit 1; }
          echo "frontend ready"

      - name: UI 冒烟
        run: node ops/smoke_ui.mjs

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: /tmp/crm-smoke/
          retention-days: 7
          if-no-files-found: ignore
